services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_DB: mir
      POSTGRES_USER: mir
      POSTGRES_PASSWORD: mir
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mir -d mir"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
